[package]
name = "ascnet-launcher"
version = "1.0.28"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
aes = "0.8"
ctr = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
lz4_flex = "0.11"
reqwest = { version = "0.12", features = ["blocking", "json"] }
uuid = { version = "1", features = ["v4"] }
semver = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
cab = "0.6"
msi = "0.8"
mp4 = "0.14"
openh264 = "0.9"
cpal = "0.16"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-winit-030", "raw-window-handle-06", "image-default-formats"] }
rfd = { version = "0.15", default-features = false }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Wdk_System_SystemInformation",
    "Wdk_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.18"
winresource = { version = "0.1", default-features = false }

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
